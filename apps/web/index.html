<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Audit: what the page may load and run. Everything comes from serve.py's own origin (the built
      app, /api, the service worker); no inline script, no plugin, no other site. The page holds the
      whole ledger and draws the copilot's answers, so a script slipped into one (a payee name, a
      model's reply) has nowhere to run from. frame-ancestors only works as a header (serve.py).
      Vite's dev server injects inline scripts and styles, so vite.config.ts drops this tag in dev.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- the browser bar and the iPhone status bar take the page colour (--page in src/index.css), light or dark -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f1e1d" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Kopifund</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
