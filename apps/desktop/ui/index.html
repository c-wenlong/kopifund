<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kopifund</title>
<!-- G23: the window shows this page until serve.py prints its ready line, and
     again if the server stops. The colours are web/src/index.css's page and
     ink tokens (server/tests/test_desktop_start_page.py keeps them equal), so the switch to the app does not flash. -->
<style>
  :root { --page: #f6f5f0; --ink: #1f1e1d; --ink-2: #55544f; --line: rgb(31 30 29 / 0.12); color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --page: #1f1e1d; --ink: #f0eee6; --ink-2: #b4b2a9; --line: rgb(255 255 255 / 0.1); }
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  main { width: min(560px, calc(100% - 32px)); text-align: center; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 16px; font-weight: 600; margin: 12px 0 4px; }
  p { color: var(--ink-2); margin: 0; }
  pre {
    text-align: left; white-space: pre-wrap; word-break: break-word;
    font: inherit; font-size: 12px; color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    margin: 16px 0; max-height: 240px; overflow: auto;
    -webkit-user-select: text; user-select: text;
  }
  button {
    font: inherit; font-weight: 600; color: var(--page); background: var(--ink);
    border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <section id="starting">
    <h1>Starting Kopifund</h1>
    <p>Opening your record.</p>
  </section>
  <section id="failed" hidden>
    <h1 id="heading">Kopifund's server stopped</h1>
    <p id="hint">The last lines it printed:</p>
  </section>
  <pre id="log" hidden></pre>
  <button id="retry" type="button" hidden>Retry</button>
</main>
<script>
  const invoke = window.__TAURI__.core.invoke;
  const $ = (id) => document.getElementById(id);
  const HEADINGS = {
    stopped: "Kopifund's server stopped",
    timed_out: "Kopifund's server did not start",
    code_gone: "Kopifund's code is gone",
  };
  // a start that takes longer than this shows what the server has printed so far
  const SHOW_LOG_AFTER_MS = 5000;
  let startedAt = Date.now();

  function show(s) {
    $("starting").hidden = s.failed;
    $("failed").hidden = !s.failed;
    $("retry").hidden = !s.failed;
    if (s.failed) {
      $("heading").textContent = HEADINGS[s.phase] || HEADINGS.stopped;
      $("hint").hidden = s.phase === "code_gone";
    }
    const late = Date.now() - startedAt > SHOW_LOG_AFTER_MS;
    $("log").hidden = !(s.failed || (late && s.log.length));
    $("log").textContent = s.log.join("\n") || "It printed nothing.";
  }

  async function poll() {
    let s = null;
    try {
      s = await invoke("status");
      show(s);
    } catch (e) {
      // the shell could not answer this once: ask again rather than stop asking
    } finally {
      if (!s || !s.failed) setTimeout(poll, 300);
    }
  }

  $("retry").addEventListener("click", async () => {
    const button = $("retry");
    if (button.disabled) return;
    button.disabled = true;
    try {
      await invoke("retry");
    } catch (e) {
      // the status poll below shows what happened
    } finally {
      button.disabled = false;
      startedAt = Date.now();
      poll();
    }
  });
  poll();
</script>
</body>
</html>
