name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # poppler gives `pdftotext`, so the one test that reads a real PDF runs
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: make install
      - run: make check
      - run: make build

  # G23: the desktop shell builds only on a Mac (the Ubuntu runner has no WebKit
  # libraries for a Linux build), and `make check` skips it off a Mac, so without
  # this job a break in main.rs or tauri.conf.json would merge green
  desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo check --locked
      - run: cargo test --locked

  # The iOS app's Swift packages (G24, G25), each in its own step so a failure names its package
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test Matching
        run: cd apps/ios/Packages/Matching && swift test
      - name: swift test YNABClient
        run: cd apps/ios/Packages/YNABClient && swift test
      - name: swift test Intents
        run: cd apps/ios/Packages/Intents && swift test
      - name: swift test KopifundClient
        run: cd apps/ios/Packages/KopifundClient && swift test
      - name: swift test Storage
        run: cd apps/ios/Packages/Storage && swift test
